<script>
(function(){
var KIND="pdf", ITER=600000, KEY="ajhub_pw";
function b64(s){var r=atob(s),u=new Uint8Array(r.length);for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u;}
async function decrypt(pw){
  var d=b64(document.getElementById('c').textContent.trim()), salt=d.slice(8,16), ct=d.slice(16);
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  var bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},base,384));
  var key=await crypto.subtle.importKey('raw',bits.slice(0,32),'AES-CBC',false,['decrypt']);
  var pt=new Uint8Array(await crypto.subtle.decrypt({name:'AES-CBC',iv:bits.slice(32,48)},key,ct));
  var m=new TextDecoder().decode(pt.slice(0,7)); if(m!=="AJHUB1\n") throw new Error('bad');
  return pt.slice(7);
}
function show(bytes){
  if(KIND==="pdf"){
    var url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
    document.body.innerHTML='<div style="position:fixed;inset:0;display:flex;flex-direction:column"><div style="padding:8px 14px;background:#fff;border-bottom:1px solid #e2e8f0;font:600 13px system-ui;display:flex;gap:14px"><a href="../index.html#resumes" style="color:#3730a3">← Career Hub</a><a download="'+document.title.replace(/[^\w-]+/g,'_')+'.pdf" href="'+url+'" style="color:#3730a3;margin-left:auto">Download PDF</a></div><iframe src="'+url+'" style="flex:1;border:0;width:100%" title="Resume PDF"></iframe></div>';
    document.body.style.cssText='display:block;padding:0';
  } else { var h=new TextDecoder().decode(bytes); document.open(); document.write(h); document.close(); }
}
async function attempt(pw,remember,silent){
  var b=document.getElementById('b'),e=document.getElementById('e'); b.disabled=true; b.textContent='Unlocking…'; e.textContent='';
  try{ var out=await decrypt(pw);
       try{ (remember?localStorage:sessionStorage).setItem(KEY,pw); if(!remember) localStorage.removeItem(KEY);}catch(_){}
       show(out); }
  catch(err){ b.disabled=false; b.textContent='Unlock'; if(!silent) e.textContent='Wrong password — try again.';
       try{localStorage.removeItem(KEY);sessionStorage.removeItem(KEY);}catch(_){} }
}
document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault();attempt(document.getElementById('pw').value,document.getElementById('rem').checked,false);});
var saved=null; try{saved=localStorage.getItem(KEY)||sessionStorage.getItem(KEY);}catch(_){}
if(saved) attempt(saved,!!localStorage.getItem(KEY),true);
})();
